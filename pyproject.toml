[project]
name = "prompt-optimizer"
version = "0.1.0"
description = "LLM提示词优化引擎 - 通过测试集驱动+LLM自我迭代自动优化系统提示词"
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.40.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "diskcache>=5.6",
    "sqlmodel>=0.0.16",
    "pandas>=2.0",
    "streamlit>=1.30",
    "loguru>=0.7",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
prompt-optimizer = "src.ui.app:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
